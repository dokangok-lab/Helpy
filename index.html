<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Erledigt! – To-do App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Erledigt!">
<meta name="theme-color" content="#e2542f">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1f1d1a; --muted: #7a746a;
    --line: #e4ded2; --accent: #e2542f; --accent-ink: #fff;
    --hoch: #e2542f; --mittel: #e0a526; --niedrig: #4c9a6a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #211f1c; --ink: #f1ece3; --muted: #9b948a; --line: #34312c; --shadow: 0 1px 2px rgba(0,0,0,.3); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; padding: max(24px, env(safe-area-inset-top)) 16px 80px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 2.2rem; margin: 0; letter-spacing: -.03em; line-height: 1; }
  h1 span { color: var(--accent); }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  .datum { color: var(--muted); font-size: .9rem; margin-top: 6px; }
  .version {
    font: 600 .75rem/1 ui-monospace, Menlo, monospace; vertical-align: middle; letter-spacing: 0;
    background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 5px 9px; cursor: pointer;
  }
  .datei { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .datei .btn { padding: 8px 12px; font-size: .9rem; }
  .status { width: 100%; text-align: right; font-size: .78rem; color: var(--muted); min-height: 1em; }
  .status.ungespeichert { color: var(--mittel); }

  .karte { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--niedrig); transition: width .3s; }

  input, select, button, textarea { font: inherit; color: inherit; }
  input[type=text], input[type=date], input[type=time], select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.leise { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
  .btn.gefahr { background: transparent; color: var(--hoch); border: 1px solid var(--line); }
  .zeile { display: flex; gap: 8px; }
  .zeile + .zeile { margin-top: 8px; flex-wrap: wrap; }
  .zeile input[type=text] { flex: 1; }

  /* Kategorie-Bereich */
  .kats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .kats::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg);
    border-radius: 99px; padding: 7px 12px; cursor: pointer; white-space: nowrap; font-size: .92rem;
  }
  .chip .punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--farbe, var(--muted)); }
  .chip .zahl { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .chip.aktiv { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.aktiv .zahl { color: inherit; opacity: .7; }
  .verwalten { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .verwalten[hidden] { display: none; }
  .kat-zeile { display: flex; gap: 8px; align-items: center; }
  .kat-zeile .emoji { width: 52px; flex: none; text-align: center; padding: 8px 4px; }
  .kat-zeile .name { flex: 1; min-width: 0; }
  .kat-zeile input[type=color] { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--bg); flex: none; }

  /* Anhänge */
  .anhaenge { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .anhang {
    position: relative; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0; cursor: pointer;
    height: 56px; min-width: 56px; max-width: 160px; display: inline-flex; align-items: center; gap: 6px; overflow: hidden;
  }
  .anhang.bild { width: 56px; }
  .anhang img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .anhang .datei-icon { font-size: 1.3rem; padding-left: 10px; }
  .anhang .datei-name { font-size: .78rem; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; text-align: left; }
  .anhang .weg {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff;
    font-size: 11px; display: grid; place-items: center;
  }
  .anhang.mehr { width: 56px; justify-content: center; color: var(--muted); font-size: .85rem; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; cursor: pointer; color: var(--muted); }
  .tabs button.aktiv { background: var(--ink); color: var(--bg); }
  .toolbar input[type=text] { flex: 1; min-width: 140px; padding: 8px 12px; }

  ul#liste { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  li.task {
    display: flex; align-items: flex-start; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--prio, var(--line)); border-radius: 12px; padding: 12px 8px 12px 14px; box-shadow: var(--shadow);
    animation: rein .2s ease;
  }
  @keyframes rein { from { opacity: 0; transform: translateY(-4px); } }
  li.task.dragging { opacity: .4; }
  .check {
    appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: none; border: 2px solid var(--muted); border-radius: 50%;
    cursor: pointer; display: grid; place-items: center; margin: 1px 0 0;
  }
  .check:checked { background: var(--niedrig); border-color: var(--niedrig); }
  .check:checked::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 700; }
  .inhalt { flex: 1; min-width: 0; cursor: pointer; }
  .titel { word-break: break-word; }
  li.erledigt .titel { text-decoration: line-through; color: var(--muted); }
  li.erledigt .anhaenge { opacity: .6; }
  .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 3px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 7px; background: color-mix(in srgb, var(--farbe) 15%, transparent); color: var(--ink); }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--farbe); }
  .faellig.ueber { color: var(--hoch); font-weight: 600; }
  .aktionen { display: flex; gap: 0; }
  .icon { border: 0; background: none; cursor: pointer; padding: 6px 7px; border-radius: 8px; color: var(--muted); font-size: 1rem; }
  .icon:hover { background: var(--bg); color: var(--ink); }
  .leer { text-align: center; color: var(--muted); padding: 40px 0; }
  .leer b { display: block; font-size: 2rem; margin-bottom: 6px; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); font-size: .9rem; gap: 8px; flex-wrap: wrap; }

  .verlauf-kopf { display: flex; justify-content: space-between; align-items: center; }
  .verlauf h3 { font-size: .85rem; color: var(--muted); margin: 8px 0 6px; font-weight: 600; }
  .verlauf .spalten { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .verlauf ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .85rem; max-height: 220px; overflow: auto; }
  .verlauf li { display: flex; gap: 8px; }
  .verlauf code { font-weight: 700; color: var(--accent); flex: none; }
  .verlauf span { color: var(--muted); }

  /* Bearbeiten-Fenster */
  dialog {
    border: 1px solid var(--line); border-radius: 18px; background: var(--card); color: var(--ink); padding: 0;
    width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 16px; display: grid; gap: 10px; }
  dialog label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
  dialog label > * { color: var(--ink); font-size: 1rem; }
  .gitter { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .knoepfe { display: flex; gap: 8px; justify-content: space-between; margin-top: 6px; }
  .knoepfe div { display: flex; gap: 8px; }

  /* Bildansicht */
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.96); z-index: 30; display: none; flex-direction: column; }
  .viewer.offen { display: flex; }
  .viewer .leiste { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: max(12px, env(safe-area-inset-top)) 12px 12px; color: #fff; }
  .viewer .leiste span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
  .viewer .leiste a, .viewer .leiste button { color: #fff; background: rgba(255,255,255,.15); border: 0; border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: .9rem; cursor: pointer; flex: none; }
  .viewer .bildflaeche { flex: 1; display: grid; place-items: center; padding: 12px; min-height: 0; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(120px); background: var(--ink); color: var(--bg);
    padding: 10px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; transition: transform .25s; z-index: 40; max-width: calc(100vw - 24px);
  }
  .toast.zeigen { transform: translateX(-50%) translateY(0); }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; }
  @media (max-width: 520px) {
    h1 { font-size: 1.8rem; } .stat b { font-size: 1.25rem; }
    .verlauf .spalten, .gitter { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Erledigt<span>!</span> <button class="version" id="appVersion" title="Versionsverlauf anzeigen"></button></h1>
      <div class="datum" id="datum"></div>
    </div>
    <div class="datei">
      <button class="btn leise" id="glocke" title="Mitteilungen ein/aus">🔕</button>
      <button class="btn leise" id="laden" title="Aufgaben aus einer Datei laden">📂 Laden</button>
      <button class="btn" id="speichern" title="Aufgaben als Datei speichern">💾 Speichern</button>
      <input type="file" id="dateiInput" accept=".json,application/json" hidden>
      <div class="status" id="status"></div>
    </div>
  </header>

  <section class="karte verlauf" id="verlauf" hidden>
    <div class="verlauf-kopf"><b>Versionen</b><button class="icon" id="verlaufZu" aria-label="Schließen">✕</button></div>
    <div class="spalten">
      <div><h3>Deine Speicherstände</h3><ol id="speicherVerlauf"></ol></div>
      <div><h3>App-Updates</h3><ol id="appVerlauf"></ol></div>
    </div>
  </section>

  <section class="stats">
    <div class="stat"><b id="sOffen">0</b><small>Offen</small></div>
    <div class="stat"><b id="sErledigt">0</b><small>Erledigt</small></div>
    <div class="stat"><b id="sProzent">0 %</b><small>Fortschritt</small><div class="bar"><i id="bar"></i></div></div>
  </section>

  <section class="karte" id="katBereich">
    <h2>Kategorien</h2>
    <div class="kats" id="kats"></div>
    <div class="verwalten" id="verwalten" hidden></div>
  </section>

  <form class="karte" id="formNeu" autocomplete="off">
    <div class="zeile">
      <input type="text" id="eingabe" placeholder="Was muss erledigt werden?" maxlength="200" required>
      <button class="btn" type="submit">Hinzufügen</button>
    </div>
    <div class="zeile">
      <select id="kategorie" aria-label="Kategorie"></select>
      <select id="prio" aria-label="Priorität">
        <option value="niedrig">🟢 Niedrig</option>
        <option value="mittel" selected>🟡 Mittel</option>
        <option value="hoch">🔴 Hoch</option>
      </select>
      <input type="date" id="faellig" aria-label="Fällig am">
      <input type="time" id="zeit" aria-label="Uhrzeit">
      <select id="erinnerung" aria-label="Erinnerung">
        <option value="">🔔 Keine Erinnerung</option>
        <option value="0">🔔 Zur Uhrzeit</option>
        <option value="15">🔔 15 Min vorher</option>
        <option value="60">🔔 1 Std vorher</option>
        <option value="1440">🔔 1 Tag vorher</option>
      </select>
      <button class="btn leise" type="button" id="neuAnhangBtn">📎 Foto / Datei</button>
      <input type="file" id="neuDateien" multiple hidden>
    </div>
    <div class="anhaenge" id="neuAnhaenge"></div>
  </form>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button data-filter="alle" class="aktiv">Alle</button>
      <button data-filter="offen">Offen</button>
      <button data-filter="erledigt">Erledigt</button>
    </div>
    <input type="text" id="suche" placeholder="🔍 Suchen …">
    <select id="sortierung" aria-label="Sortieren">
      <option value="manuell">Eigene Reihenfolge</option>
      <option value="prio">Nach Priorität</option>
      <option value="datum">Nach Fälligkeit</option>
    </select>
  </div>

  <ul id="liste"></ul>

  <footer>
    <span id="info"></span>
    <button class="btn leise" id="aufraeumen">Erledigte löschen</button>
  </footer>
</div>

<dialog id="dialog">
  <form method="dialog" id="dForm">
    <label>Aufgabe<input type="text" id="dText" maxlength="200" required></label>
    <div class="gitter">
      <label>Kategorie<select id="dKat"></select></label>
      <label>Priorität<select id="dPrio">
        <option value="niedrig">🟢 Niedrig</option><option value="mittel">🟡 Mittel</option><option value="hoch">🔴 Hoch</option>
      </select></label>
      <label>Datum<input type="date" id="dDatum"></label>
      <label>Uhrzeit<input type="time" id="dZeit"></label>
    </div>
    <label>Erinnerung<select id="dErinnerung">
      <option value="">Keine Erinnerung</option><option value="0">Zur Uhrzeit</option><option value="15">15 Min vorher</option>
      <option value="60">1 Std vorher</option><option value="1440">1 Tag vorher</option>
    </select></label>
    <label>Fotos & Dateien</label>
    <div class="anhaenge" id="dAnhaenge" style="margin-top:-6px"></div>
    <div><button class="btn leise" type="button" id="dAnhangBtn">📎 Hinzufügen</button><input type="file" id="dDateien" multiple hidden></div>
    <div class="knoepfe">
      <button class="btn gefahr" type="button" id="dLoeschen">🗑️ Löschen</button>
      <div>
        <button class="btn leise" type="button" id="dAbbrechen">Abbrechen</button>
        <button class="btn" type="submit" id="dSpeichern">Fertig</button>
      </div>
    </div>
  </form>
</dialog>

<div class="viewer" id="viewer">
  <div class="leiste"><span id="vName"></span><div style="display:flex;gap:8px"><a id="vLaden" download>⬇️ Sichern</a><button id="vZu">✕</button></div></div>
  <div class="bildflaeche" id="vFlaeche"><img id="vBild" alt=""></div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="rueckgaengig">Rückgängig</button></div>

<script>
(() => {
  // ============ Grundlagen ============
  const KEY = 'erledigt-app-v1', KKEY = 'erledigt-kategorien', VKEY = 'erledigt-versionen', MKEY = 'erledigt-mitteilungen';
  const $ = s => document.querySelector(s);
  const el = (tag, props = {}, ...kinder) => {
    const e = Object.assign(document.createElement(tag), props);
    for (const k of kinder) if (k !== null && k !== undefined && k !== false) e.append(k);
    return e;
  };
  const lesen = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch { return d; } };
  const schreiben = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const heute = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const PRIO = { hoch: 0, mittel: 1, niedrig: 2 };
  const PRIO_FARBE = { hoch: 'var(--hoch)', mittel: 'var(--mittel)', niedrig: 'var(--niedrig)' };
  const FARBEN = ['#3b7dd8', '#e2542f', '#4c9a6a', '#9b59b6', '#e0a526', '#16a3a3', '#d6457a', '#6b6b6b'];
  const hatErinnerung = t => t.erinnerung !== null && t.erinnerung !== undefined && t.erinnerung !== '';

  // ============ Versionen (V0.01-Schritte) ============
  const APP_VERSION = 'V0.04';
  const APP_VERLAUF = [
    ['V0.04', 'Fotos & Dateien anhängen, Kategorie-Bereich, Bearbeiten-Fenster'],
    ['V0.03', 'Uhrzeit, Erinnerungen als Mitteilung, Kalendereintrag, als App installierbar'],
    ['V0.02', 'Speichern & Laden als Datei, Versionsverfolgung'],
    ['V0.01', 'Erste Version: Aufgaben, Filter, Suche, Sortierung'],
  ];
  // Speicherstände: jedes Speichern +0.01 → V0.01, V0.02 … V0.99, V1.00
  let versionen = lesen(VKEY, []);
  const vText = n => 'V' + (n / 100).toFixed(2);
  const aktuelleNr = () => versionen.length ? versionen[0].nr : 0;

  // ============ Daten ============
  let tasks = lesen(KEY, []);
  let kategorien = lesen(KKEY, null) || [
    { id: 'k1', name: 'Privat', emoji: '🏠', farbe: '#3b7dd8' },
    { id: 'k2', name: 'Arbeit', emoji: '💼', farbe: '#e2542f' },
    { id: 'k3', name: 'Einkaufen', emoji: '🛒', farbe: '#4c9a6a' },
  ];
  const kat = kid => kategorien.find(k => k.id === kid);

  // Alte Aufgaben mit Text-Kategorie in den Kategorie-Bereich übernehmen
  function migrieren() {
    for (const t of tasks) {
      if (t.kat && !t.katId) {
        let k = kategorien.find(k => k.name.toLowerCase() === String(t.kat).toLowerCase());
        if (!k) { k = { id: id(), name: String(t.kat).slice(0, 30), emoji: '🏷️', farbe: FARBEN[kategorien.length % FARBEN.length] }; kategorien.push(k); }
        t.katId = k.id;
      }
      delete t.kat;
      if (t.katId && !kat(t.katId)) t.katId = null;
      if (!Array.isArray(t.anhaenge)) t.anhaenge = [];
    }
  }
  migrieren();

  let filter = 'alle', katFilter = 'alle', suche = '', sortierung = 'manuell';
  let rueckgaengigStand = null, toastTimer, dateiHandle = null, ungespeichert = false;

  function speichern(markieren = true) {
    schreiben(KEY, tasks); schreiben(KKEY, kategorien);
    if (markieren) { ungespeichert = true; zeigeStatus(); }
  }

  // ============ Anhänge (im Browser-Speicher IndexedDB) ============
  let dbP = null;
  function db() {
    if (!dbP) dbP = new Promise((ok, fehler) => {
      if (!('indexedDB' in window)) return fehler(new Error('kein IndexedDB'));
      const r = indexedDB.open('erledigt', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('anhaenge', { keyPath: 'id' });
      r.onsuccess = () => ok(r.result);
      r.onerror = () => fehler(r.error);
    });
    return dbP;
  }
  async function idb(modus, fn) {
    const d = await db();
    return new Promise((ok, fehler) => {
      const tx = d.transaction('anhaenge', modus);
      const anfrage = fn(tx.objectStore('anhaenge'));
      tx.oncomplete = () => ok(anfrage && anfrage.result);
      tx.onerror = () => fehler(tx.error);
      tx.onabort = () => fehler(tx.error);
    });
  }
  const idbPut = o => idb('readwrite', s => s.put(o));
  const idbGet = k => idb('readonly', s => s.get(k));
  const idbDel = k => idb('readwrite', s => s.delete(k));
  const idbAll = () => idb('readonly', s => s.getAll());
  const idbClear = () => idb('readwrite', s => s.clear());

  const urls = new Map();
  async function anhangUrl(aid) {
    if (urls.has(aid)) return urls.get(aid);
    const a = await idbGet(aid).catch(() => null);
    if (!a) return null;
    const u = URL.createObjectURL(new Blob([a.data], { type: a.typ }));
    urls.set(aid, u); return u;
  }

  const MAX_GROESSE = 15 * 1024 * 1024;
  async function verkleinern(datei) {
    if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(datei.type) || !window.createImageBitmap) return datei;
    try {
      const bmp = await createImageBitmap(datei);
      const f = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      if (f === 1 && datei.size < 1.5e6) return datei;
      const c = el('canvas', { width: Math.round(bmp.width * f), height: Math.round(bmp.height * f) });
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      return b ? new File([b], (datei.name || 'Foto').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : datei;
    } catch { return datei; }
  }
  async function dateienAufnehmen(liste) {
    const neu = [];
    for (const roh of liste) {
      if (roh.size > MAX_GROESSE) { toast(`„${roh.name}“ ist zu groß (max. 15 MB)`, false); continue; }
      const d = await verkleinern(roh);
      const a = { id: id(), name: d.name || 'Datei', typ: d.type || 'application/octet-stream', groesse: d.size };
      try { await idbPut({ ...a, data: await d.arrayBuffer() }); neu.push(a); }
      catch { toast('Speicher voll – Anhang konnte nicht gespeichert werden', false); }
    }
    return neu;
  }
  const dateiIcon = a => /pdf/.test(a.typ) ? '📄' : /^audio/.test(a.typ) ? '🎵' : /^video/.test(a.typ) ? '🎬' : /zip|rar|7z/.test(a.typ) ? '🗜️' : /word|text|document/.test(a.typ) ? '📝' : /sheet|excel|csv/.test(a.typ) ? '📊' : '📎';

  function anhangKachel(a, entfernen) {
    const bild = a.typ.startsWith('image/');
    const k = el('button', { type: 'button', className: 'anhang' + (bild ? ' bild' : ''), title: a.name });
    if (bild) { const img = el('img', { alt: a.name, loading: 'lazy' }); anhangUrl(a.id).then(u => { if (u) img.src = u; }); k.append(img); }
    else k.append(el('span', { className: 'datei-icon', textContent: dateiIcon(a) }), el('span', { className: 'datei-name', textContent: a.name }));
    k.onclick = e => { e.stopPropagation(); oeffnen(a); };
    if (entfernen) {
      const x = el('span', { className: 'weg', textContent: '✕', title: 'Entfernen' });
      x.onclick = e => { e.stopPropagation(); entfernen(); };
      k.append(x);
    }
    return k;
  }

  async function oeffnen(a) {
    const u = await anhangUrl(a.id);
    if (!u) { toast('Anhang nicht gefunden', false); return; }
    if (a.typ.startsWith('image/')) {
      $('#vBild').src = u; $('#vName').textContent = a.name;
      $('#vLaden').href = u; $('#vLaden').download = a.name;
      $('#viewer').classList.add('offen');
    } else {
      const l = el('a', { href: u, target: '_blank', rel: 'noopener', download: a.name });
      document.body.append(l); l.click(); l.remove();
    }
  }
  $('#vZu').onclick = () => $('#viewer').classList.remove('offen');
  $('#vFlaeche').onclick = e => { if (e.target.id === 'vFlaeche') $('#viewer').classList.remove('offen'); };

  // Nicht mehr benutzte Anhänge beim Start aufräumen
  async function aufraeumenAnhaenge() {
    try {
      const benutzt = new Set(tasks.flatMap(t => t.anhaenge.map(a => a.id)));
      for (const a of await idbAll()) if (!benutzt.has(a.id)) await idbDel(a.id);
    } catch {}
  }

  function datumText(d) {
    if (!d) return '';
    const diff = Math.round((new Date(d + 'T12:00') - new Date(heute() + 'T12:00')) / 864e5);
    if (diff === 0) return 'Heute';
    if (diff === 1) return 'Morgen';
    if (diff === -1) return 'Gestern';
    return new Date(d + 'T12:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  }

  function sichtbar() {
    let l = tasks.filter(t =>
      (filter === 'alle' || (filter === 'offen' ? !t.done : t.done)) &&
      (katFilter === 'alle' || (katFilter === 'ohne' ? !t.katId : t.katId === katFilter)) &&
      (!suche || (t.text + ' ' + (kat(t.katId)?.name || '') + ' ' + t.anhaenge.map(a => a.name).join(' ')).toLowerCase().includes(suche))
    );
    if (sortierung === 'prio') l = [...l].sort((a, b) => PRIO[a.prio] - PRIO[b.prio]);
    if (sortierung === 'datum') l = [...l].sort((a, b) => ((a.faellig || '9999') + (a.zeit || '')).localeCompare((b.faellig || '9999') + (b.zeit || '')));
    return l;
  }

  function render() {
    const liste = $('#liste');
    liste.innerHTML = '';
    const l = sichtbar();

    if (!l.length) {
      let txt = '<b>✨</b>Noch keine Aufgaben. Leg oben los!';
      if (tasks.length) txt = (filter === 'offen' && !suche) ? '<b>🎉</b>Alles erledigt!' : '<b>🔍</b>Nichts gefunden.';
      liste.append(el('li', { className: 'leer', innerHTML: txt }));
    }

    for (const t of l) {
      const li = el('li', { className: 'task' + (t.done ? ' erledigt' : '') });
      li.style.setProperty('--prio', PRIO_FARBE[t.prio]);
      li.dataset.id = t.id;
      li.draggable = sortierung === 'manuell';

      const cb = el('input', { type: 'checkbox', className: 'check', checked: t.done, ariaLabel: 'Erledigt' });
      cb.onchange = () => { t.done = cb.checked; t.doneAt = t.done ? Date.now() : null; speichern(); renderKategorien(); render(); };

      const inhalt = el('div', { className: 'inhalt', title: 'Antippen zum Bearbeiten' }, el('div', { className: 'titel', textContent: t.text }));
      inhalt.onclick = () => bearbeiten(t);

      const meta = el('div', { className: 'meta' });
      const k = kat(t.katId);
      if (k) { const tag = el('span', { className: 'tag', textContent: `${k.emoji || ''} ${k.name}`.trim() }); tag.style.setProperty('--farbe', k.farbe); meta.append(tag); }
      if (t.faellig) {
        const ueber = !t.done && (t.faellig < heute() || (t.faellig === heute() && t.zeit && t.zeit < new Date().toTimeString().slice(0, 5)));
        meta.append(el('span', { className: 'faellig' + (ueber ? ' ueber' : ''), textContent: '📅 ' + datumText(t.faellig) + (t.zeit ? ', ' + t.zeit : '') + (hatErinnerung(t) ? ' 🔔' : '') }));
      }
      if (t.anhaenge.length) meta.append(el('span', { textContent: '📎 ' + t.anhaenge.length }));
      if (meta.childNodes.length) inhalt.append(meta);

      if (t.anhaenge.length) {
        const box = el('div', { className: 'anhaenge' });
        t.anhaenge.slice(0, 4).forEach(a => box.append(anhangKachel(a)));
        if (t.anhaenge.length > 4) box.append(el('span', { className: 'anhang mehr', textContent: '+' + (t.anhaenge.length - 4) }));
        inhalt.append(box);

      const akt = el('div', { className: 'aktionen' });

      akt.append(knopf('🗑️', 'Löschen', () => loeschen([t.id], 'Aufgabe gelöscht')));

      li.append(cb, inhalt, akt);
      liste.append(li);
    }

    const offen = tasks.filter(t => !t.done).length, fertig = tasks.length - offen;
    const p = tasks.length ? Math.round(fertig / tasks.length * 100) : 0;
    $('#sOffen').textContent = offen;

    $('#sProzent').textContent = p + ' %';

    $('#aufraeumen').style.visibility = fertig ? 'visible' : 'hidden';
  }

  // ============ Als Datei speichern (inkl. Fotos & Dateien) ============
  const dateiname = nr => `aufgaben-${vText(nr)}.json`;
  const zuBase64 = buf => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.readAsDataURL(new Blob([buf])); });
  const vonBase64 = b64 => { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };

  async function inhaltJSON(nr) {
    const benutzt = new Set(tasks.flatMap(t => t.anhaenge.map(a => a.id)));
    const anhaenge = [];
    for (const a of await idbAll().catch(() => [])) {
      if (benutzt.has(a.id)) anhaenge.push({ id: a.id, name: a.name, typ: a.typ, daten: await zuBase64(a.data) });
    }
    return JSON.stringify({
      app: 'erledigt', appVersion: APP_VERSION, version: vText(nr), gespeichert: new Date().toISOString(),
      verlauf: versionen.slice(0, 50), kategorien, tasks, anhaenge
    });
  }
  function neueVersion() {
    const nr = aktuelleNr() + 1;
    versionen.unshift({ nr, zeit: Date.now(), anzahl: tasks.length, erledigt: tasks.filter(t => t.done).length });
    schreiben(VKEY, versionen.slice(0, 50)); zeigeVerlauf();
    return nr;
  }
  function versionZurueck() { versionen.shift(); schreiben(VKEY, versionen); zeigeVerlauf(); }

  async function inDateiSpeichern() {
    const nr = neueVersion();
    // Moderne Browser (Chrome, Edge): Datei wählen und danach immer wieder dorthin speichern
    if (window.showSaveFilePicker) {
      try {
        if (!dateiHandle) {
          dateiHandle = await showSaveFilePicker({ suggestedName: dateiname(nr), types: [{ description: 'Aufgaben-Datei', accept: { 'application/json': ['.json'] } }] });
        }
        zeigeStatus('⏳ Speichert …');
        const w = await dateiHandle.createWritable();
        await w.write(await inhaltJSON(nr)); await w.close();
        ungespeichert = false; zeigeStatus(`✓ ${vText(nr)} gespeichert in ${dateiHandle.name}`);
        return;
      } catch (e) {
        if (e.name === 'AbortError') { versionZurueck(); zeigeStatus(); return; }
        dateiHandle = null;
      }
    }
    // Alle anderen Browser (Safari, Firefox, Handy): als Download
    zeigeStatus('⏳ Speichert …');
    const url = URL.createObjectURL(new Blob([await inhaltJSON(nr)], { type: 'application/json' }));
    const a = el('a', { href: url, download: dateiname(nr) });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    ungespeichert = false; zeigeStatus(`✓ ${vText(nr)} heruntergeladen`);
  }

  // ============ Aus Datei laden ============
  async function datenUebernehmen(text, name) {
    let d;
    try { d = JSON.parse(text); } catch { toast('Datei konnte nicht gelesen werden', false); return; }
    const roh = Array.isArray(d) ? d : d.tasks;
    if (!Array.isArray(roh)) { toast('Das ist keine Aufgaben-Datei', false); return; }

    if (Array.isArray(d.kategorien)) {
      kategorien = d.kategorien.filter(k => k && k.id && k.name).map(k => ({
        id: String(k.id), name: String(k.name).slice(0, 30), emoji: String(k.emoji || '').slice(0, 4),
        farbe: /^#[0-9a-f]{6}$/i.test(k.farbe) ? k.farbe : FARBEN[0]
      }));
    }
    tasks = roh.filter(t => t && typeof t.text === 'string').map(t => ({
      id: String(t.id || id()), text: t.text.slice(0, 200), done: !!t.done,
      prio: PRIO[t.prio] !== undefined ? t.prio : 'mittel',
      katId: t.katId ? String(t.katId) : null, kat: t.kat || null,
      faellig: /^\d{4}-\d{2}-\d{2}$/.test(t.faellig || '') ? t.faellig : null,
      zeit: /^\d{2}:\d{2}$/.test(t.zeit || '') ? t.zeit : null,
      erinnerung: Number.isFinite(t.erinnerung) ? t.erinnerung : null, benachrichtigt: !!t.benachrichtigt,
      anhaenge: Array.isArray(t.anhaenge) ? t.anhaenge.filter(a => a && a.id).map(a => ({ id: String(a.id), name: String(a.name || 'Datei'), typ: String(a.typ || 'application/octet-stream'), groesse: +a.groesse || 0 })) : [],
      erstellt: t.erstellt || Date.now(), doneAt: t.doneAt || null
    }));
    migrieren();

    if (Array.isArray(d.anhaenge)) {
      try {
        await idbClear();
        urls.forEach(u => URL.revokeObjectURL(u)); urls.clear();
        for (const a of d.anhaenge) if (a && a.id && a.daten) await idbPut({ id: String(a.id), name: a.name, typ: a.typ, groesse: 0, data: vonBase64(a.daten) });
      } catch { toast('Anhänge konnten nicht alle geladen werden', false); }
    }

    const m = /^V(\d+)\.(\d{2})$/.exec(d.version || '');
    if (Array.isArray(d.verlauf) && d.verlauf.length) versionen = d.verlauf.filter(v => Number.isFinite(v.nr));
    else if (m) versionen = [{ nr: +m[1] * 100 + +m[2], zeit: Date.parse(d.gespeichert) || Date.now(), anzahl: tasks.length, erledigt: tasks.filter(t => t.done).length }];
    schreiben(VKEY, versionen); zeigeVerlauf();

    katFilter = 'alle';
    speichern(false); ungespeichert = false; renderKategorien(); render();
    const v = versionen.length ? vText(aktuelleNr()) : '';
    zeigeStatus(`✓ Geladen: ${v ? v + ' · ' : ''}${name}`);
    toast(`${v ? v + ': ' : ''}${tasks.length} Aufgaben geladen`, false);
  }

  $('#speichern').onclick = inDateiSpeichern;
  $('#laden').onclick = async () => {
    if (window.showOpenFilePicker) {
      try {
        const [h] = await showOpenFilePicker({ types: [{ description: 'Aufgaben-Datei', accept: { 'application/json': ['.json'] } }] });
        const f = await h.getFile(); dateiHandle = h;
        await datenUebernehmen(await f.text(), f.name);
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    $('#dateiInput').click();
  };
  $('#dateiInput').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    await datenUebernehmen(await f.text(), f.name);
    e.target.value = '';
  };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); inDateiSpeichern(); }
    if (e.key === 'Escape') $('#viewer').classList.remove('offen');
  });
  window.addEventListener('beforeunload', e => { if (ungespeichert && tasks.length) { e.preventDefault(); e.returnValue = ''; } });

  // ============ Kalendereintrag (.ics) ============
  const ics = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const plusTag = d => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + 1); return `${x.getFullYear()}${String(x.getMonth() + 1).padStart(2, '0')}${String(x.getDate()).padStart(2, '0')}`; };
  function kalender(t) {
    const d = t.faellig.replace(/-/g, '');
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    let zeitZeilen;
    if (t.zeit) {
      const [h, m] = t.zeit.split(':').map(Number);
      const ende = new Date(2000, 0, 1, h, m + 30);
      const hm = (a, b) => String(a).padStart(2, '0') + String(b).padStart(2, '0') + '00';
      zeitZeilen = [`DTSTART:${d}T${hm(h, m)}`, `DTEND:${ende.getDate() === 2 ? plusTag(t.faellig) : d}T${hm(ende.getHours(), ende.getMinutes())}`];
    } else {
      zeitZeilen = [`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${plusTag(t.faellig)}`];
    }
    const vorher = hatErinnerung(t) ? t.erinnerung : (t.zeit ? 15 : null);
    const alarm = vorher === null ? [] : ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${ics(t.text)}`, `TRIGGER:-PT${vorher}M`, 'END:VALARM'];
    const k = kat(t.katId);
    const inhalt = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Erledigt//DE', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      `UID:${t.id}@erledigt`, `DTSTAMP:${stamp}`, ...zeitZeilen,
      `SUMMARY:${ics(t.text)}`, `DESCRIPTION:${ics('Aufgabe aus Erledigt!' + (k ? ' – ' + k.name : ''))}`,
      ...(k ? [`CATEGORIES:${ics(k.name)}`] : []),
      ...alarm, 'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
    const url = URL.createObjectURL(new Blob([inhalt], { type: 'text/calendar;charset=utf-8' }));
    const a = el('a', { href: url, download: (t.text.replace(/[^\wäöüÄÖÜß -]/g, '').slice(0, 40).trim() || 'Termin') + '.ics' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Kalendereintrag erstellt – Datei öffnen, um ihn hinzuzufügen', false);
  }

  // ============ Mitteilungen ============
  let swReg = null;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
  }
  const mitteilungenAn = () => 'Notification' in window && Notification.permission === 'granted' && lesen(MKEY, 'an') !== 'aus';
  function glockeZeigen() { $('#glocke').textContent = mitteilungenAn() ? '🔔' : '🔕'; }

  $('#glocke').onclick = async () => {
    if (!('Notification' in window)) {
      const ios = /iPhone|iPad/.test(navigator.userAgent);
      toast(ios ? 'Auf dem iPhone: erst Teilen → „Zum Home-Bildschirm“, dann die App von dort öffnen' : 'Dieser Browser kann keine Mitteilungen', false);
      return;
    }
    if (mitteilungenAn()) { schreiben(MKEY, 'aus'); glockeZeigen(); toast('Mitteilungen aus', false); return; }
    schreiben(MKEY, 'an');
    const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    glockeZeigen();
    if (p === 'granted') { melden('Mitteilungen sind an ✓', 'Du wirst an fällige Aufgaben erinnert.'); pruefen(); }
    else toast('Mitteilungen wurden nicht erlaubt (in den Einstellungen änderbar)', false);
  };

  function melden(titel, text) {
    const opt = { body: text, icon: 'icon-192.png', badge: 'icon-192.png', tag: titel };
    if (swReg && swReg.showNotification) swReg.showNotification(titel, opt).catch(() => { try { new Notification(titel, opt); } catch {} });
    else { try { new Notification(titel, opt); } catch { toast(titel + ': ' + text, false); } }
  }

  const zeitpunkt = t => new Date(`${t.faellig}T${t.zeit || '09:00'}`).getTime() - (t.erinnerung || 0) * 6e4;
  function pruefen() {
    const jetzt = Date.now(); let geaendert = false;
    for (const t of tasks) {
      if (t.done || !t.faellig || !hatErinnerung(t) || t.benachrichtigt) continue;
      if (zeitpunkt(t) <= jetzt) {
        const wann = t.erinnerung ? `in ${t.erinnerung >= 1440 ? '1 Tag' : t.erinnerung >= 60 ? '1 Stunde' : t.erinnerung + ' Minuten'}` : 'jetzt';
        if (mitteilungenAn()) melden('⏰ ' + t.text, `Fällig ${wann}${t.zeit ? ' (' + t.zeit + ' Uhr)' : ''}`);
        else toast('⏰ ' + t.text, false);
        t.benachrichtigt = true; geaendert = true;
      }
    }
    if (geaendert) { speichern(); render(); }
  }
  setInterval(pruefen, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pruefen(); });

  // ============ Start ============
  glockeZeigen(); zeigeVerlauf(); zeigeStatus();
  renderNeuAnhaenge(); renderKategorien(); render();
  speichern(false);
  aufraeumenAnhaenge();
  setTimeout(pruefen, 1500);
})();
</script>
</body>
</html>
